version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dev:
        dependency-type: development
        patterns: ["*"]
  # Bumps the hook revisions in .pre-commit-config.yaml, including the biome hook's
  # additional_dependencies pin (@biomejs/biome). The Lint workflow reads the Biome version from that
  # file; only the biome.json $schema must be bumped by hand (the Lint workflow fails until it is).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
